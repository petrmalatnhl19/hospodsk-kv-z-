
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050817">
<title>Cosmic Quiz – Dlouhá Lhota</title>
<style>
:root {
 --bg:#050817;--cyan:#62eaff;--gold:#ffd36b;
 --panel:rgba(12,27,56,.91);--line:#4acfff55;
 --muted:#a4b8d5;--white:#effaff;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:var(--white);
 font-family:Arial, sans-serif;
 background:radial-gradient(ellipse at 50% 0%,#193568,#081127 48%,#02040c);
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background-image:
 radial-gradient(2px 2px at 15% 20%,white,transparent),
 radial-gradient(1px 1px at 70% 35%,#65eaff,transparent),
 radial-gradient(2px 2px at 40% 75%,white,transparent),
 radial-gradient(1px 1px at 88% 82%,white,transparent);
 background-size:240px 220px;opacity:.7
}
header{
 position:relative;padding:16px;
 border-bottom:1px solid var(--line);
 background:#050a19dd;text-align:center;
}
.brand{font-weight:900;letter-spacing:4px;color:var(--cyan)}
main{position:relative;max-width:1100px;margin:auto;padding:15px}
.panel{
 background:linear-gradient(145deg,#142b50ee,#071126f5);
 border:1px solid var(--line);border-radius:18px;
 padding:17px;margin-bottom:14px;
 box-shadow:0 12px 45px #0009,inset 0 0 30px #46cfff0b;
}
h1{font-size:clamp(30px,6vw,65px);text-align:center}
h2{color:var(--cyan);font-size:21px}
button{
 border:1px solid #65dfff88;border-radius:12px;
 padding:13px 15px;background:linear-gradient(135deg,#125274,#112748);
 color:white;font-size:15px;font-weight:bold;cursor:pointer;
}
button.primary{background:linear-gradient(135deg,#087f9e,#174b91)}
button.gold{background:linear-gradient(135deg,#78521b,#473112)}
button.danger{background:#632532}
input{
 width:100%;padding:12px;background:#071226;
 color:white;border:1px solid #4b759c;border-radius:9px;
 margin:5px 0;
}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.small{font-size:12px;color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:5px 10px;color:var(--cyan);font-size:12px}
.question{min-height:160px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.question-text{font-size:clamp(24px,4vw,45px);font-weight:900}
.answer{font-size:clamp(20px,3vw,30px);color:var(--gold);margin-top:20px}
.timer{text-align:center;font-size:55px;font-weight:900;color:var(--gold);margin:10px}
.leader{list-style:none;padding:0}
.leader li{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line);font-size:20px}
.leader b{color:var(--gold)}
.teamrow{display:grid;grid-template-columns:1fr 90px;gap:8px;margin:8px 0}
.hidden{display:none!important}
.orb{
 width:145px;height:145px;border-radius:50%;margin:15px auto;
 background:radial-gradient(circle at 30% 25%,white,#60dfff 9%,#1477b5 30%,#08142f 68%,#02050e);
 box-shadow:0 0 45px #3bd9ff99,inset -15px -12px 25px #000b;
 position:relative;
}
.orb:after{
 content:"";position:absolute;inset:28px -20px;
 border:2px solid #74eaffaa;border-radius:50%;
 transform:rotate(-24deg);box-shadow:0 0 20px #3bd9ff;
}
#status{font-size:12px;color:#9ce9ff}
.screen{text-align:center;max-width:1200px;padding:4vh 4vw}
.screen .panel{min-height:65vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.screen .question-text{max-width:1000px}
.screen .timer{font-size:clamp(50px,8vw,95px)}
.screen .leader{width:min(750px,100%);text-align:left}
.screen .leader li{font-size:clamp(20px,3vw,34px)}
footer{text-align:center;color:#6e8cab;padding:12px;font-size:11px}
@media(min-width:850px){
 .admin{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
 .wide{grid-column:1/-1}
}
@media(max-width:520px){
 main{padding:9px}.panel{padding:13px}
 .teamrow{grid-template-columns:1fr 75px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const rounds=[
{name:"Všeobecný přehled",questions:[
["Která planeta Sluneční soustavy je největší?","Jupiter"],
["Kolik stran má pravidelný šestiúhelník?","Šest"],
["Jak se jmenuje hlavní město Austrálie?","Canberra"],
["Který chemický prvek má značku Fe?","Železo"],
["Kolik minut má hodina a půl?","90 minut"],
["Kdo napsal Babičku?","Božena Němcová"],
["Jaká je nejdelší řeka České republiky?","Vltava"],
["Který oceán je největší?","Tichý oceán"]
]},
{name:"Hudební hádanky",questions:[
["Kdo složil symfonickou báseň Vltava?","Bedřich Smetana"],
["Jak se nazývá člověk dirigující orchestr?","Dirigent"],
["Kolik strun má běžná kytara?","Šest"],
["Kdo nazpíval Bohemian Rhapsody?","Queen"],
["Jak se nazývá hudební značka označující ticho?","Pomlka"],
["Který nástroj má klávesy a struny?","Klavír"],
["Z jaké země pochází reggae?","Jamajka"],
["Jak se nazývá rychlost skladby?","Tempo"]
]},
{name:"Česko a okolí",questions:[
["Ve kterém kraji leží Tábor?","Jihočeský kraj"],
["Kdo založil Karlovu univerzitu?","Karel IV."],
["Jaká je nejvyšší hora Šumavy?","Plechý"],
["Která řeka protéká Českými Budějovicemi?","Vltava"],
["Jaké je hlavní město Slovenska?","Bratislava"],
["Který hrad je spojen s Karlem IV.?","Karlštejn"],
["Jak se jmenuje největší český rybník?","Rožmberk"],
["Ve kterém pohoří leží Sněžka?","Krkonoše"]
]},
{name:"Obrázková poznávačka",questions:[
["Poznejte slavnou šikmou věž v Itálii.","Šikmá věž v Pise"],
["Který černobílý medvěd jí převážně bambus?","Panda velká"],
["Poznejte slavnou pařížskou železnou věž.","Eiffelova věž"],
["Které africké zvíře má dlouhý krk?","Žirafa"],
["Kdo namaloval Monu Lisu?","Leonardo da Vinci"],
["Jak se nazývá egyptská stavba s trojúhelníkovými stěnami?","Pyramida"],
["U které planety jsou nejvýraznější prstence?","Saturn"],
["Jaké zvíře je ve státním znaku ČR?","Lev"]
]},
{name:"Tipovačky a překvapení",questions:[
["Kolik polí má šachovnice?","64"],
["Kolik kostí má dospělý člověk přibližně?","206"],
["Kolik kilometrů měří maraton?","42,195 km"],
["Kolik dní má přestupný rok?","366"],
["Kolik hráčů jednoho týmu je na fotbalovém hřišti?","11"],
["Kolik komor má lidské srdce?","Čtyři"],
["Kolik kruhů obsahuje olympijský symbol?","Pět"],
["Kolik stupňů má pravý úhel?","90"]
]}
];

const params=new URLSearchParams(location.search);
const isScreen=params.has("screen");
let state=null;
let timer=null;
let lastUpdate=0;

function initial(){
 return {
 teams:Array.from({length:6},(_,i)=>({id:i+1,name:"Tým "+(i+1),score:0})),
 round:0,q:0,answer:false,seconds:30,remaining:30,
 running:false,phase:"intro",draft:{}
 };
}
function current(){return rounds[state.round].questions[state.q]}
function ranking(){return [...state.teams].sort((a,b)=>b.score-a.score)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function sync(){
 try{
  const r=await fetch("/api/state",{cache:"no-store"});
  if(!r.ok)throw Error();
  const d=await r.json();
  if(d.state && d.updated>lastUpdate){
   state=d.state;lastUpdate=d.updated;render();
  }
 }catch(e){
  const el=document.querySelector("#status");
  if(el)el.textContent="Spojení se serverem přerušeno";
 }
}
async function save(){
 try{
  const r=await fetch("/api/state",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(state)
  });
  if(!r.ok)throw Error();
  const d=await r.json();lastUpdate=d.updated;
  const el=document.querySelector("#status");
  if(el)el.textContent="Synchronizováno";
 }catch(e){
  alert("Nepodařilo se uložit změny. Zkontroluj Wi-Fi.");
 }
}
function render(){
 if(!state)return;
 isScreen?renderScreen():renderAdmin();
}
function renderAdmin(){
 const q=current();
 document.querySelector("#app").innerHTML=`
 <header>
 <div class="brand">✦ COSMIC QUIZ · DLOUHÁ LHOTA ✦</div>
 <div id="status">Připojeno</div>
 </header>
 <main class="admin">
 <section class="panel">
 <span class="pill">KOLO ${state.round+1}/5</span>
 <span class="pill">OTÁZKA ${state.q+1}/8</span>
 <h2>${esc(rounds[state.round].name)}</h2>
 <div class="question">
 <div class="question-text">${esc(q[0])}</div>
 ${state.answer?`<div class="answer">${esc(q[1])}</div>`:""}
 </div>
 <div class="timer">${state.remaining}s</div>
 <div class="row">
 <button class="primary" onclick="toggleTimer()">${state.running?"Pozastavit":"Spustit čas"}</button>
 <button onclick="reveal()">Odhalit odpověď</button>
 </div>
 <div class="row" style="margin-top:10px">
 <button class="primary" onclick="nextQuestion()">Další otázka →</button>
 <button onclick="scrollScores()">Bodování kola</button>
 </div>
 </section>
 <section class="panel">
 <h2>🏆 Průběžné pořadí</h2>
 <ol class="leader">${ranking().map(t=>`<li><span>${esc(t.name)}</span><b>${t.score} b.</b></li>`).join("")}</ol>
 <button class="gold" onclick="showBoard()">Promítnout pořadí</button>
 </section>
 <section class="panel wide" id="scores">
 <h2>Vstup bodů za kolo</h2>
 <p class="small">Zadej body všem týmům. Potvrzením se přičtou k celkovému skóre.</p>
 ${state.teams.map(t=>`
 <div class="teamrow">
 <label>${esc(t.name)}</label>
 <input type="number" min="0" max="100" id="score-${t.id}" value="${state.draft[t.id]||0}">
 </div>`).join("")}
 <div class="row">
 <button class="primary" onclick="commitScores()">Potvrdit body a zveřejnit pořadí</button>
 <button onclick="clearDraft()">Vynulovat vstup</button>
 </div>
 </section>
 <section class="panel wide">
 <h2>Správa týmů</h2>
 <div class="grid">
 ${state.teams.map(t=>`
 <div><label>Název týmu</label>
 <input value="${esc(t.name)}" onchange="renameTeam(${t.id},this.value)">
 <span class="small">${t.score} bodů</span></div>`).join("")}
 </div>
 <div class="row">
 <button onclick="addTeam()">＋ Přidat tým</button>
 <button class="danger" onclick="removeTeam()">Odebrat poslední tým</button>
 <button onclick="resetGame()">Nový kvíz</button>
 </div>
 </section>
 </main>
 <footer>HOSPODSKÝ KVÍZ · DLOUHÁ LHOTA</footer>`;
}
function renderScreen(){
 const q=current();
 let content="";
 if(state.phase==="board"){
  content=`<div class="orb"></div><h1>GALAKTICKÉ POŘADÍ</h1>
  <ol class="leader">${ranking().map(t=>`<li><span>${esc(t.name)}</span><b>${t.score} bodů</b></li>`).join("")}</ol>`;
 }else if(state.phase==="intro"){
  content=`<div class="orb"></div><h1>COSMIC QUIZ</h1><div class="question-text">DLOUHÁ LHOTA</div><p>Vědomosti · Tým · Sláva</p>`;
 }else{
  content=`<span class="pill">${esc(rounds[state.round].name)} · KOLO ${state.round+1} · OTÁZKA ${state.q+1}</span>
  <div class="orb"></div><div class="question-text">${esc(q[0])}</div>
  <div class="timer">${state.remaining}</div>
  ${state.answer?`<div class="answer">SPRÁVNÁ ODPOVĚĎ<br>${esc(q[1])}</div>`:"<p>ČAS NA VAŠE ODPOVĚDI</p>"}`;
 }
 document.querySelector("#app").innerHTML=`
 <header><div class="brand">✦ HOSPODSKÝ KVÍZ · DLOUHÁ LHOTA ✦</div></header>
 <main class="screen"><section class="panel">${content}</section></main>
 <footer>COSMIC QUIZ EXPERIENCE</footer>`;
}
async function toggleTimer(){
 if(state.running){state.running=false;clearInterval(timer);timer=null;}
 else{
  if(state.remaining<=0)state.remaining=state.seconds;
  state.running=true;
  timer=setInterval(async()=>{
   if(state.remaining>0)state.remaining--;
   else{state.running=false;clearInterval(timer);timer=null;}
   await save();render();
  },1000);
 }
 await save();render();
}
async function reveal(){
 state.answer=true;state.running=false;
 clearInterval(timer);timer=null;
 await save();render();
}
async function nextQuestion(){
 state.running=false;clearInterval(timer);timer=null;
 state.answer=false;
 if(state.q<7)state.q++;
 else if(state.round<4){state.round++;state.q=0;}
 else{state.phase="board";}
 state.remaining=state.seconds;
 if(state.phase!=="board")state.phase="question";
 await save();render();
}
function scrollScores(){document.querySelector("#scores").scrollIntoView({behavior:"smooth"});}
async function commitScores(){
 for(const t of state.teams){
  const el=document.querySelector("#score-"+t.id);
  t.score+=Math.max(0,Number(el?.value||0));
  state.draft[t.id]=0;
 }
 state.phase="board";
 await save();render();
}
async function clearDraft(){state.draft={};await save();render();}
async function renameTeam(id,name){
 const t=state.teams.find(x=>x.id===id);
 if(t)t.name=name.trim()||t.name;
 await save();
}
async function addTeam(){
 if(state.teams.length>=12)return alert("Maximálně 12 týmů.");
 const id=Math.max(...state.teams.map(t=>t.id))+1;
 state.teams.push({id,name:"Tým "+id,score:0});
 await save();render();
}
async function removeTeam(){
 if(state.teams.length<=2)return alert("Musí zůstat alespoň dva týmy.");
 if(confirm("Odebrat poslední tým?")){state.teams.pop();await save();render();}
}
async function showBoard(){state.phase="board";await save();render();}
async function resetGame(){
 if(!confirm("Opravdu resetovat celý kvíz a všechny body?"))return;
 state=initial();await save();render();
}
async function init(){
 await sync();
 if(!state){state=initial();await save();}
 render();
 setInterval(sync,isScreen?500:1000);
}
init();
</script>
</body>
</html>
